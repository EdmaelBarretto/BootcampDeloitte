</div>


<script>


const API = "http://localhost:8080/produtos";


// MENSAGEM
function mostrarMensagem(msg, tipo="success") {
    document.getElementById("mensagem").innerHTML = `
        <div class="alert alert-${tipo} mt-3">${msg}</div>
    `;
}


// BUSCAR POR ID
function buscar() {
    const id = document.getElementById("id").value;


    if (!id) {
        mostrarMensagem("Informe um ID para buscar", "warning");
        return;
    }


    fetch(`${API}/${id}`)
        .then(res => {
            if (!res.ok) throw new Error();
            return res.json();
        })
        .then(p => {
            document.getElementById("nome").value = p.nome;
            document.getElementById("preco").value = p.preco;
            document.getElementById("estoque").value = p.estoque;


            mostrarMensagem("Produto carregado!");
        })
        .catch(() => mostrarMensagem("Produto não encontrado", "danger"));
}


// SALVAR (CREATE ou UPDATE)
document.getElementById("produtoForm").addEventListener("submit", function(e) {
    e.preventDefault();


    const id = document.getElementById("id").value;


    const produto = {
        nome: document.getElementById("nome").value,
        preco: parseFloat(document.getElementById("preco").value),
        estoque: parseInt(document.getElementById("estoque").value)
    };


    const metodo = id ? "PUT" : "POST";
    const url = id ? `${API}/${id}` : API;


    fetch(url, {
        method: metodo,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(produto)
    })
    .then(res => {
        if (!res.ok) throw new Error();
        mostrarMensagem(id ? "Produto atualizado!" : "Produto cadastrado!");
        limpar();
    })
    .catch(() => mostrarMensagem("Erro ao salvar produto", "danger"));
});


// LIMPAR
function limpar() {
    document.getElementById("produtoForm").reset();
}


</script>
