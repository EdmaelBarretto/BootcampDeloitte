<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Produtos do Ed</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">

<div class="container py-5">

    <h1 class="text-center mb-4">🛒 Produtos do Ed</h1>

    <!-- MENSAGEM -->
    <div id="mensagem"></div>

    <!-- FORM -->
    <div class="card shadow">
        <div class="card-body">

            <form id="produtoForm">

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <input type="text" id="nome" class="form-control" placeholder="Nome" required>
                    </div>

                    <div class="col-md-4 mb-3">
                        <input type="number" id="preco" class="form-control" placeholder="Preço" required>
                    </div>

                    <div class="col-md-4 mb-3">
                        <input type="number" id="estoque" class="form-control" placeholder="Estoque" required>
                    </div>
                </div>

                <button class="btn btn-dark w-100" type="submit">Salvar Produto</button>

            </form>
        </div>
    </div>

    <!-- TABELA -->
    <div class="card mt-4 shadow">
        <div class="card-body">
            <h5>Lista de Produtos</h5>

            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Preço</th>
                        <th>Estoque</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela"></tbody>
            </table>

        </div>
    </div>

</div>

<!-- JS -->
<script src="js/app.js"></script>

</body>
</html>
