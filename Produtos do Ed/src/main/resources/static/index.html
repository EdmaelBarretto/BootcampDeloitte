<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos do Ed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

<div class="container py-5">

    <h1 class="text-center mb-4">🛒 Produtos do Ed</h1>

    <div id="mensagem"></div>

    <!-- FORM -->
    <div class="card shadow mb-4">
        <div class="card-body">
            <h5 class="card-title mb-3">Cadastrar Produto</h5>

            <!-- ✅ SEM action, SEM method — controlado 100% pelo JS -->
            <form id="produtoForm" novalidate>

                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Nome</label>
                        <input
                            type="text"
                            id="nome"
                            class="form-control"
                            placeholder="Ex: Teclado Mecânico"
                            minlength="3"
                            required
                        >
                        <div class="invalid-feedback">Nome deve ter no mínimo 3 caracteres.</div>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Preço (R$)</label>
                        <input
                            type="text"
                            id="preco"
                            class="form-control"
                            placeholder="R$ 0,00"
                            inputmode="numeric"
                            required
                        >
                        <div class="invalid-feedback">Informe um preço válido maior que zero.</div>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Estoque</label>
                        <input
                            type="text"
                            id="estoque"
                            class="form-control"
                            placeholder="0"
                            inputmode="numeric"
                            required
                        >
                        <div class="invalid-feedback">Estoque não pode ser negativo.</div>
                    </div>
                </div>

                <button class="btn btn-dark w-100 mt-3" type="submit">
                    💾 Salvar Produto
                </button>

            </form>
        </div>
    </div>

    <!-- TABELA -->
    <div class="card shadow">
        <div class="card-body">
            <h5 class="card-title mb-3">Lista de Produtos</h5>

            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Preço</th>
                            <th>Estoque</th>
                            <th class="text-center">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela">
                        <tr id="linha-vazia">
                            <td colspan="5" class="text-center text-muted py-4">Nenhum produto cadastrado.</td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

</div>

<!-- ✅ JS no final do body — garante que o DOM já existe quando o script roda -->
<script src="js/app.js"></script>

</body>
</html>
